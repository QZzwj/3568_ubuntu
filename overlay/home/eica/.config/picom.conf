# picom 9 —— M-3568HA (RK3568 / Mali, X11)
# 作用：窗口淡入淡出 + 圆角 + 更柔和的阴影 + 非活动窗口轻微淡化
# 出问题一键回滚：sh /opt/xfce-mac-desktop/disable-picom.sh

# ---- 渲染后端 ----
# RK3568 的 glx 路径在 X11 下不稳，用 xrender（与 xfwm4 自带合成器同一路径）
backend = "xrender";
vsync = false;
use-damage = true;

# ---- 淡入淡出 ----
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# ---- 阴影 ----
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;

# ---- 窗口透明度 ----
inactive-opacity = 0.95;
frame-opacity = 1.0;
detect-client-opacity = true;

# ---- 圆角 ----
corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Plank'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow-exclude = [
  "class_g = 'Plank'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-notifyd'"
];

mark-wmwin-focused = true;
detect-rounded-corners = true;
log-level = "warn";

wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  desktop = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
  tooltip = { opacity = 1.0; shadow = false; };
  notification = { opacity = 1.0; shadow = false; };
};
