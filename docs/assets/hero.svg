<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="3568_ubuntu — RK3568 M-3568HA Ubuntu XFCE desktop kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1D"/>
      <stop offset="0.6" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.0" r="0.8">
      <stop offset="0" stop-color="#1246FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1246FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#3E6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3E6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4C7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C7BFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#4C7BFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4C7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EEFF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#FFFFFF" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="card"><rect width="548" height="312" rx="16"/></clipPath>
    <filter id="soft2" x="-25%" y="-40%" width="150%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1533" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      .f  { font-family: "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
      .m  { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .t1 { font-size: 60px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1.5px; }
      .t1b{ font-size: 60px; font-weight: 700; fill: #6E96FF; letter-spacing: -1.5px; }
      .t2 { font-size: 19px; fill: #BAC8EA; }
      .t2b{ font-size: 18px; fill: #8496BE; }
      .tag{ font-size: 14px; fill: #B9C9F2; letter-spacing: 0.8px; }
      .st { font-size: 14px; fill: #6F80A9; letter-spacing: 0.3px; }
      .cmd{ font-size: 15px; fill: #D6E1FF; }
      .d  { font-size: 12px; fill: #5E6E8F; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#g1)"/>
  <rect width="1280" height="400" rx="24" fill="url(#g2)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <ellipse cx="952" cy="210" rx="360" ry="230" fill="url(#halo)"/>

  <!-- 左侧 -->
  <g transform="translate(76,68)">
    <rect x="-13" y="-13" width="242" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="3" cy="3" r="4" fill="#1246FF"/>
    <text class="f tag" x="15" y="8">Rockchip RK3568 · M-3568HA</text>
  </g>

  <text class="f t1" x="74" y="180">3568<tspan class="t1b">_ubuntu</tspan></text>

  <text class="f t2" x="76" y="222">出厂裸 Ubuntu Base，一条命令变成能用的桌面</text>
  <text class="f t2b" x="76" y="252">启动台 · 控制中心 · mac Dock · 浅色主题 · 触屏已校准</text>

  <g transform="translate(76,292)" class="f st">
    <text x="0" y="0">Ubuntu 22.04</text>
    <circle cx="110" cy="-5" r="2.4" fill="#38456B"/>
    <text x="128" y="0">XFCE 4.16 + picom</text>
    <circle cx="282" cy="-5" r="2.4" fill="#38456B"/>
    <text x="300" y="0">1280×720 MIPI</text>
    <circle cx="428" cy="-5" r="2.4" fill="#38456B"/>
    <text x="446" y="0">#1246FF</text>
    <rect x="530" y="-14" width="15" height="15" rx="4" fill="#1246FF"/>
  </g>

  <g transform="translate(76,330)">
    <rect width="470" height="46" rx="12" fill="#070D1E" stroke="#1A2750"/>
    <circle cx="22" cy="23" r="4.2" fill="#2E3A5C"/>
    <circle cx="38" cy="23" r="4.2" fill="#2E3A5C"/>
    <circle cx="54" cy="23" r="4.2" fill="#2E3A5C"/>
    <text class="m cmd" x="76" y="28"><tspan fill="#68789F">$ </tspan>sudo ./scripts/apply-overlay.sh</text>
  </g>

  <!-- 右侧设备 -->
  <g transform="translate(668,44)" filter="url(#soft)">
    <rect width="548" height="312" rx="16" fill="url(#screen)"/>
    <g clip-path="url(#card)">
    <!-- 顶栏 -->
    <rect x="0" y="0" width="548" height="32" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="18" width="548" height="14" fill="#FFFFFF"/>
    <g transform="translate(14,9)" stroke="#1246FF" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="13" height="13" rx="3.5"/>
      <path d="M3.5 3.5 h6 v6"/>
    </g>
    <g transform="translate(430,9)" fill="none" stroke="#2C3A57" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 8 a11 11 0 0 1 16 0"/>
      <path d="M3.5 11.5 a6 6 0 0 1 9 0"/>
      <circle cx="8" cy="15" r="1.6" fill="#2C3A57" stroke="none"/>
      <path d="M28 4 v11 M34 2 v13"/>
      <path d="M56 5 a6.5 6.5 0 0 1 0 13 l-2.5 0 M60 10.5 v4"/>
    </g>
    <text class="f" x="500" y="20" font-size="11" fill="#2C3A57" fill-opacity="0.8">18:32</text>

    <!-- 桌面：壁纸 + 中央 logo -->
    <rect x="0" y="32" width="548" height="280" fill="url(#screen)"/>
    <ellipse cx="274" cy="118" rx="168" ry="112" fill="url(#lg)"/>
    <g transform="translate(232,74)">
      <rect width="84" height="84" rx="20" fill="#1246FF" fill-opacity="0.10" stroke="#1246FF" stroke-opacity="0.45" stroke-width="1.8"/>
      <g stroke="#1246FF" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(21,21)">
        <path d="M10 0 v4 M21 0 v4 M32 0 v4 M10 38 v4 M21 38 v4 M32 38 v4"/>
        <path d="M0 10 h4 M0 21 h4 M0 32 h4 M38 10 h4 M38 21 h4 M38 32 h4"/>
        <rect x="5" y="5" width="32" height="32" rx="8"/>
        <path d="M13 13 h14 l-14 14 h14"/>
      </g>
    </g>
    <text class="f d" x="274" y="180" text-anchor="middle" letter-spacing="2.4">嵌入式智控协会</text>

    <!-- Dock -->
    <g filter="url(#soft2)">
      <rect x="98" y="234" width="352" height="60" rx="19" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>
    <g transform="translate(114,245)">
      <rect width="38" height="38" rx="11" fill="#1246FF" fill-opacity="0.10" stroke="#1246FF" stroke-opacity="0.65" stroke-width="1.6"/>
      <g stroke="#1246FF" stroke-width="1.7" fill="none" stroke-linecap="round" transform="translate(6,6)">
        <path d="M7 0 v3.2 M14 0 v3.2 M21 0 v3.2 M7 24 v3.2 M14 24 v3.2 M21 24 v3.2"/>
        <path d="M0 7 h3.2 M0 14 h3.2 M0 21 h3.2 M24 7 h3.2 M24 14 h3.2 M24 21 h3.2"/>
        <rect x="4" y="4" width="19" height="19" rx="5"/>
      </g>
    </g>
    <g transform="translate(166,245)">
      <rect width="38" height="38" rx="11" fill="#F1F1F2"/>
      <rect x="7" y="9" width="24" height="7" rx="2" fill="#BFC3CA"/>
      <rect x="7" y="19" width="24" height="12" rx="3" fill="#D9AE58"/>
    </g>
    <g transform="translate(218,245)">
      <rect width="38" height="38" rx="11" fill="#2E3238"/>
      <text class="m" x="19.5" y="25" font-size="13" fill="#E9EBEE" text-anchor="middle">&gt;_</text>
    </g>
    <g transform="translate(270,245)">
      <rect width="38" height="38" rx="11" fill="#F4F6FD"/>
      <circle cx="15" cy="17" r="8" fill="#1246FF" fill-opacity="0.85"/>
      <circle cx="25" cy="23" r="6.5" fill="#7AA2FF"/>
      <circle cx="22" cy="12" r="5" fill="#3DDC97" fill-opacity="0.8"/>
    </g>
    <g transform="translate(322,245)">
      <rect width="38" height="38" rx="11" fill="#EAF1F6"/>
      <circle cx="19" cy="19" r="10" fill="none" stroke="#5C7A91" stroke-width="2.2" stroke-dasharray="3 2.6"/>
      <circle cx="19" cy="19" r="3.4" fill="#5C7A91"/>
    </g>
    <g transform="translate(374,245)">
      <rect width="38" height="38" rx="11" fill="#EFF3FF"/>
      <circle cx="19" cy="19" r="10.5" fill="none" stroke="#1246FF" stroke-width="2" stroke-opacity="0.7"/>
      <path d="M19 8.5 a10.5 10.5 0 0 1 0 21 z" fill="#1246FF" fill-opacity="0.4"/>
    </g>
    </g>
    <rect x="0.5" y="0.5" width="547" height="311" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
  </g>
</svg>
