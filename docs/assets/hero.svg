<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="3568_ubuntu — RK3568 M-3568HA Ubuntu XFCE desktop kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B52"/>
      <stop offset="0.55" stop-color="#1246FF"/>
      <stop offset="1" stop-color="#4C7BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#08123A" flood-opacity="0.35"/>
    </filter>
    <style>
      .t  { font-family: "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
      .h1 { font-size: 58px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1px; }
      .sub{ font-size: 23px; font-weight: 400; fill: #D8E3FF; }
      .ch { font-size: 18px; font-weight: 600; fill: #FFFFFF; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; fill: #FFFFFF; }
      .mock-t { font-size: 13px; fill: #16233D; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>

  <!-- 左侧：标识 -->
  <g transform="translate(64,64)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M26 12 v10 M38 12 v10 M50 12 v10 M26 54 v10 M38 54 v10 M50 54 v10"/>
      <path d="M12 26 h10 M12 38 h10 M12 50 h10 M54 26 h10 M54 38 h10 M54 50 h10"/>
      <rect x="22" y="22" width="32" height="32" rx="8"/>
    </g>
    <path d="M32 32 h14 l-14 14 h14" stroke="#FFFFFF" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- 标题 -->
  <text class="t h1" x="164" y="118">3568_ubuntu</text>
  <text class="t sub" x="166" y="156">RK3568 · M-3568HA · Ubuntu 22.04 + XFCE 桌面套件</text>

  <!-- 特性标签 -->
  <g class="t ch">
    <g transform="translate(64,206)">
      <rect width="104" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="52" y="25" text-anchor="middle">启动台</text>
    </g>
    <g transform="translate(180,206)">
      <rect width="116" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="58" y="25" text-anchor="middle">控制中心</text>
    </g>
    <g transform="translate(308,206)">
      <rect width="96" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="48" y="25" text-anchor="middle">mac Dock</text>
    </g>
    <g transform="translate(416,206)">
      <rect width="128" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="64" y="25" text-anchor="middle">虚拟桌面滑动</text>
    </g>
    <g transform="translate(556,206)">
      <rect width="116" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="58" y="25" text-anchor="middle">触屏校准</text>
    </g>
    <g transform="translate(684,206)">
      <rect width="112" height="38" rx="19" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="56" y="25" text-anchor="middle">MIPI 屏参</text>
    </g>
  </g>

  <!-- 主色标记 -->
  <g transform="translate(64,278)">
    <rect width="26" height="26" rx="7" fill="#FFFFFF"/>
    <rect x="4" y="4" width="18" height="18" rx="5" fill="#1246FF"/>
    <text class="t mono" x="38" y="19">#1246FF 主色 · 聚焦/选中统一蓝底白字</text>
  </g>
  <g transform="translate(64,320)">
    <text class="t mono" x="0" y="0" fill-opacity="0.85">sudo ./scripts/apply-overlay.sh</text>
    <text class="t mono" x="352" y="0" fill-opacity="0.62"># 一条命令铺盘，重启面板即生效</text>
  </g>

  <!-- 右侧：桌面 mock -->
  <g transform="translate(858,48)" filter="url(#sh)">
    <rect width="360" height="262" rx="16" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="359" height="261" rx="16" fill="none" stroke="#C9D6FF"/>
    <!-- 顶栏 -->
    <rect x="0" y="0" width="360" height="26" rx="16" fill="#F2F5FF"/>
    <rect x="0" y="14" width="360" height="12" fill="#F2F5FF"/>
    <circle cx="18" cy="13" r="5" fill="#1246FF" fill-opacity="0.85"/>
    <g fill="#16233D" fill-opacity="0.75">
      <circle cx="296" cy="13" r="4"/>
      <rect x="310" y="9" width="14" height="8" rx="3"/>
      <rect x="332" y="8" width="12" height="10" rx="3" fill="#1246FF" fill-opacity="0.8"/>
    </g>
    <!-- 桌面区 -->
    <rect x="0" y="26" width="360" height="236" fill="url(#wall)"/>
    <g opacity="0.9">
      <rect x="140" y="70" width="80" height="80" rx="18" fill="#1246FF" fill-opacity="0.12" stroke="#1246FF" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M164 96 h20 l-20 20 h20" stroke="#1246FF" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <text class="t mock-t" x="180" y="176" text-anchor="middle" fill="#16233D" fill-opacity="0.55">嵌入式智控协会</text>
    </g>
    <!-- Dock -->
    <g>
      <rect x="63" y="200" width="234" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.92" stroke="#D5DEF8"/>
      <g transform="translate(78,210)">
        <rect width="32" height="32" rx="9" fill="#EEF3FF" stroke="#1246FF" stroke-opacity="0.6"/>
        <path d="M11 8 v4 M21 8 v4 M11 28 v4 M21 28 v4 M8 11 h4 M8 21 h4 M28 11 h4 M28 21 h4" stroke="#1246FF" stroke-width="2" stroke-linecap="round"/>
        <rect x="12" y="11" width="16" height="16" rx="4" stroke="#1246FF" stroke-width="2" fill="none"/>
      </g>
      <g transform="translate(120,210)">
        <rect width="32" height="32" rx="9" fill="#F0F0F0" stroke="#CFCFCF"/>
        <rect x="7" y="10" width="18" height="13" rx="2" fill="#9AA0A6"/>
      </g>
      <g transform="translate(162,210)">
        <rect width="32" height="32" rx="9" fill="#3C4043"/>
        <rect x="8" y="9" width="16" height="14" rx="2" fill="#EAEAEA"/>
      </g>
      <g transform="translate(204,210)">
        <rect width="32" height="32" rx="9" fill="#F3F6FF" stroke="#D5DEF8"/>
        <circle cx="12" cy="14" r="6" fill="#1246FF" fill-opacity="0.7"/>
        <circle cx="21" cy="20" r="5" fill="#7AA2FF"/>
      </g>
      <g transform="translate(246,210)">
        <rect width="32" height="32" rx="9" fill="#F3F6FF" stroke="#D5DEF8"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="#1246FF" stroke-width="2.4"/>
        <circle cx="16" cy="16" r="2.6" fill="#1246FF"/>
      </g>
    </g>
  </g>
</svg>
