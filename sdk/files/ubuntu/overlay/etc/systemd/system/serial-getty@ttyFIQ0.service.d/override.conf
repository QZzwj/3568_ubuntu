# RK3568 debug uart: UART2 (0xfe660000) is taken over by fiq-debugger and
# appears as /dev/ttyFIQ0 running at 1500000 baud (see rk3568-linux.dtsi).
# Without this drop-in agetty would use the default 115200 and the console
# would show garbage.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -s 1500000 --autologin root --noclear %I $TERM
Type=idle
